name: EDABIP CI

on:
  push:
    branches:
      - EDABIP-project
  pull_request:
    branches:
      - EDABIP-project

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Docker images
        run: docker compose build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker images
        run: |
          docker tag 3tier-app-backend:latest ${{ secrets.DOCKERHUB_USERNAME }}/edabip-backend:latest
          docker tag 3tier-app-frontend:latest ${{ secrets.DOCKERHUB_USERNAME }}/edabip-frontend:latest

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/edabip-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/edabip-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
         host: ${{ secrets.EC2_HOST }}
         username: ${{ secrets.EC2_USER }}
         key: ${{ secrets.EC2_SSH_KEY }}
         script: |
           cd ~/edabip
           docker compose pull
           docker compose up -d
           docker image prune -f